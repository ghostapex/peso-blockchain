[package]
name = "peso_chain"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.7"
clap = { version = "4.4", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
libp2p = { version = "0.53", features = ["tcp", "gossipsub", "identify", "kad"] }
prom = { version = "0.13", features = ["core"] }
rand = "0.8"
rocksdb = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
